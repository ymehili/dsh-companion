name: DSHCompanion
options:
  bundleIdPrefix: com.dsh
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
targets:
  DSHCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - MobileRepository*.swift
          - MobilePull*.swift
          - MobileFiles*.swift
          - MobileTerminal*.swift
          - MobileReview*.swift
          - MobileChangesTransport.swift
          - MobileProvider*.swift
          - MobileSchedules*.swift
          - MobileServerSettingsService.swift
          - MobileServerSettingsScreen.swift
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      - path: Resources/OpenUI
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.companion
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.7.2
        CURRENT_PROJECT_VERSION: 16
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_CFBundleDisplayName: DSH
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your DSH host on your private network.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code from your Mac.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos to attach to DSH.
  DSHCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
        excludes: [MobileRepositoryTests.swift, MobileFilesTests.swift, MobileTerminalTests.swift, MobileReviewTests.swift, MobileSettingsTests.swift]
    dependencies:
      - target: DSHCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DSHCompanion.app/DSHCompanion
        BUNDLE_LOADER: $(TEST_HOST)
  DSHCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [T3RepositoryProjectTests.swift, T3ToolFlowTests.swift]
    dependencies:
      - target: DSHCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DSHCompanion:
    build:
      targets:
        DSHCompanion: all
    test:
      targets: [DSHCompanionTests, DSHCompanionUITests]
